name: Website

# Publishes https://cyanidesayonara.github.io/coriolis/ to GitHub Pages.
# Compiles web/main.cpp + shared core/ and scenes/ into WebAssembly via
# Emscripten, copies site/, refreshed screenshots, and PDF manuals into _site/,
# and deploys via actions/deploy-pages.
#
# One-time repository setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "scenes/**"
      - "web/**"
      - "site/**"
      - "docs/screenshots/**"
      - "docs/*.pdf"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build WASM emulator and static site
        run: |
          set -euo pipefail
          python3 tools/build_site.py --build-wasm --out _site
          du -sh _site
          find _site -maxdepth 3 -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for artifact listing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 30); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT}" \
              --jq '[.artifacts[] | select(.expired | not)] | length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -ge 1 ]; then
              echo "${ARTIFACT} listed after ${attempt} check(s)"
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo "::warning::${ARTIFACT} not listed after 60 s; deploying anyway"

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
